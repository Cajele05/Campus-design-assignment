name: campus-network-security

topology:
  nodes:
    router:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr flush dev eth1
        - ip addr replace 10.10.10.1/24 dev eth1
        - ip link set eth1 up
        - ip addr flush dev eth2
        - ip addr replace 10.10.20.1/24 dev eth2
        - ip link set eth2 up
        - ip addr flush dev eth3
        - ip addr replace 10.10.30.1/24 dev eth3
        - ip link set eth3 up
        - ip addr flush dev eth4
        - ip addr replace 10.10.40.1/24 dev eth4
        - ip link set eth4 up
        - sysctl -w net.ipv4.ip_forward=1
        - apk add --no-cache iptables || true
          # iptables -P FORWARD DROP
          # iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          # iptables -A FORWARD -i eth3 -p tcp --dport 22 -j ACCEPT
          # iptables -A FORWARD -s 10.10.10.0/24 -d 10.10.40.80 -p tcp --dport 8080 -j ACCEPT
          # iptables -A FORWARD -s 10.10.20.0/24 -d 10.10.40.80 -p tcp --dport 8080 -j ACCEPT
          # iptables -A FORWARD -s 10.10.30.0/24 -d 10.10.40.80 -p tcp --dport 8080 -j ACCEPT
          # iptables -A FORWARD -d 10.10.40.81 -j DROP
          # iptables -A FORWARD -s 10.10.20.0/24 -d 10.10.40.100 -p tcp --dport 5432 -j ACCEPT
          # iptables -A FORWARD -s 10.10.30.0/24 -d 10.10.40.100 -p tcp --dport 5432 -j ACCEPT
          # iptables -A FORWARD -d 10.10.40.0/24 -j ACCEPT

    sw-student:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up

    sw-faculty:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up

    sw-admin:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up

    sw-services:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set eth4 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        - ip link set br0 up

    student-client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl netcat-openbsd
        - ip addr flush dev eth1
        - ip addr add 10.10.10.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.10.10.1 dev eth1


    faculty-client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl netcat-openbsd      
        - ip addr flush dev eth1
        - ip addr add 10.10.20.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.10.20.1 dev eth1

    admin-client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl netcat-openbsd      
        - ip addr flush dev eth1
        - ip addr add 10.10.30.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.10.30.1 dev eth1

    waf-proxy:
      kind: linux
      image: custom-waf:latest
      env:
        BACKEND: "http://10.10.40.81:3000"
        MODSEC_RULE_ENGINE: "On"
      binds:
        - config/modsec-custom.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-CUSTOM.conf:ro        
      exec:
        - ip addr flush dev eth1
        - ip addr add 10.10.40.80/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.10.40.1 dev eth1

    juiceshop-app:
      kind: linux
      image: custom-juiceshop:latest
      exec:
        - ip addr flush dev eth1
        - ip addr add 10.10.40.81/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.10.40.1 dev eth1

    postgres-db:
      kind: linux
      image: postgres:15-alpine
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: grading_db
      exec:
        - apk add --no-cache iproute2 || true
        - ip addr flush dev eth1
        - ip addr add 10.10.40.100/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.10.40.1 dev eth1

  links:
    - endpoints: ["router:eth1", "sw-student:eth1"]
    - endpoints: ["sw-student:eth2", "student-client:eth1"]
    - endpoints: ["router:eth2", "sw-faculty:eth1"]
    - endpoints: ["sw-faculty:eth2", "faculty-client:eth1"]
    - endpoints: ["router:eth3", "sw-admin:eth1"]
    - endpoints: ["sw-admin:eth2", "admin-client:eth1"]
    - endpoints: ["router:eth4", "sw-services:eth1"]
    - endpoints: ["sw-services:eth2", "waf-proxy:eth1"]
    - endpoints: ["sw-services:eth3", "juiceshop-app:eth1"]
    - endpoints: ["sw-services:eth4", "postgres-db:eth1"]
