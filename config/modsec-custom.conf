# =======================================================
# Custom ModSecurity WAF Rules
# Mounted at: /etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-CUSTOM.conf
# =======================================================

# Rule 1: Block SQL injection that contains a single quote
SecRule ARGS|ARGS_NAMES|REQUEST_URI "@contains \"'\" " \
    "id:999001, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'SQL Injection Detected — Single Quote in Request', \
    tag:'attack/sqli', \
    severity:CRITICAL"

# Rule 2: Block SQL keywords like UNION SELECT, DROP TABLE, etc.
SecRule ARGS|ARGS_NAMES|REQUEST_URI "@rx (?i)(union\s+select|select\s+.*\s+from|insert\s+into|delete\s+from|drop\s+table|update\s+.*\s+set|exec\s*\(|execute\s)" \
    "id:999002, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'SQL Injection Detected — SQL Keywords in Request', \
    tag:'attack/sqli', \
    severity:CRITICAL"

# Rule 3: Block OR-based tautology attacks like ' OR '1'='1
SecRule ARGS|ARGS_NAMES|REQUEST_URI "@rx (?i)(or\s+['\"]?1['\"]?\s*=\s*['\"]?1|or\s+['\"]?true['\"]?|or\s+1\s*=\s*1)" \
    "id:999003, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'SQL Injection Detected — OR-based Tautology Attack', \
    tag:'attack/sqli', \
    severity:CRITICAL"

# Rule 4: Block SQL comment syntax like -- or /*
SecRule ARGS|REQUEST_URI "@rx (?i)(--\s|/\*|\*/|;\s*--)" \
    "id:999004, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'SQL Injection Detected — SQL Comment Syntax in Request', \
    tag:'attack/sqli', \
    severity:CRITICAL"
